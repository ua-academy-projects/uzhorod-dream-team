---
- name: Ensure crypto directory exists
  ansible.builtin.file:
    path: /etc/crypto
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write DB CA certificate to file
  ansible.builtin.copy:
    src: db-ca.pem
    dest: /etc/crypto/db-ca.pem
    owner: root
    group: root
    mode: "0644"
  notify: Restart crypto-fetcher service

- name: Generate start-fetcher.sh from template
  ansible.builtin.template:
    src: start-fetcher.sh.j2
    dest: /usr/local/bin/start-fetcher.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart crypto-fetcher service

- name: Create crypto-fetcher systemd service unit
  ansible.builtin.template:
    src: crypto-fetcher.service.j2
    dest: /etc/systemd/system/crypto-fetcher.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart crypto-fetcher service

- name: Enable and start crypto-fetcher service
  ansible.builtin.systemd_service:
    name: crypto-fetcher.service
    daemon_reload: true
    enabled: true
    state: started
