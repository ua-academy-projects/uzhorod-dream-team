config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../terraform_resources_configuration/config.json') | from_json }}"

project_id: "{{ config.project.id }}"
region: "{{ config.project.region }}"
backend: "{{ config.app.backend }}"
database: "{{ config.app.database }}"

db_host: "{{ hostvars['localhost'].db_endpoint.resources[0].address if database == 'cloud_sql' else hostvars['db'].internal_dns }}"
db_name: "{{ config.cloud_sql.database }}"
db_user: "{{ config.cloud_sql.user }}"
db_password_secret: "{{ config.cloud_sql.password_secret }}"
db_disk: "/dev/disk/by-id/google-{{ config.vms.machines.db.data_disk.device_name }}"

registry_host: "{{ region }}-docker.pkg.dev"
repository_id: "{{ config.registry.repository_id }}"
history_image_tag: "{{ config.vms.machines.history.image_tag }}"
fetcher_image_tag: "{{ config.vms.machines.fetcher.image_tag }}"
ui_image_tag: "{{ config.vms.machines.ui.image_tag }}"
ui_port: "{{ config.vms.machines.ui.port }}"

hosts_history: "{{ hostvars['history'].internal_dns }}"
hosts_broker: "{{ hostvars['broker'].internal_dns }}"
