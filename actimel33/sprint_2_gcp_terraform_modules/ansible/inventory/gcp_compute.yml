plugin: google.cloud.gcp_compute
projects:
  - crypto-price-0e590f
auth_kind: serviceaccount
filters:
  - status = RUNNING
  - labels.managed_by = terraform
hostnames:
  - name
vars_prefix: gcp_
groups:
  private: "'internal-vm' in tags['items']"
  management: "'bastion-vm' in tags['items']"
compose:
  private_ip: networkInterfaces[0].networkIP
  internal_dns: name ~ '.' ~ zone.split('/')[-1] ~ '.c.' ~ selfLink.split('/')[6] ~ '.internal'
  ansible_python_interpreter: "'/usr/bin/python3'"
