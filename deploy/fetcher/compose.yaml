name: iss

services:
  cloudsql-proxy:
    profiles: [cloudsql]
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
    restart: unless-stopped
    command:
      - --private-ip
      - --auto-iam-authn
      - --address
      - 0.0.0.0
      - --port
      - "${POSTGRES_PORT:?}"
      - "${CLOUDSQL_INSTANCE?}"

  fetcher:
    build: ./src
    image: iss-fetcher:latest
    restart: unless-stopped
    labels:
      iss.pgmq-version: ${PGMQ_VERSION:?}
    depends_on:
      cloudsql-proxy:
        condition: service_started
        required: false
    environment:
      QUEUE_BACKEND: ${QUEUE_BACKEND:?}
      RABBITMQ_HOST: ${DB_IP?}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?}
      RABBITMQ_USER: ${RABBITMQ_USER:?}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:?}
      POSTGRES_HOST: ${POSTGRES_HOST:?}
      POSTGRES_PORT: ${POSTGRES_PORT:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_FETCHER_USER: ${POSTGRES_FETCHER_USER:?}
      POSTGRES_FETCHER_PASSWORD: ${POSTGRES_FETCHER_PASSWORD?}
      FETCHER_ISS_API_URL: ${FETCHER_ISS_API_URL:?}
      FETCHER_POLL_INTERVAL: ${FETCHER_POLL_INTERVAL:?}
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
