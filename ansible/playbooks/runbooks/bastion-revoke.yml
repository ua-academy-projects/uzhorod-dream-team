# Removes the temporary iss-admin key from the bastion metadata when a run was killed before its always section.
# The guest agent then deletes iss-admin (deprovision_remove). Does not connect to the VM.
# Usage: ./scripts/ansible.sh runbooks/bastion-revoke.yml
---
- name: Revoke the temporary admin key on the bastion
  hosts: bastion
  gather_facts: false
  tasks:
    - name: Check the configuration
      ansible.builtin.import_role:
        name: iss.tracker.config

    - name: Remove the temporary admin key from the instance metadata
      ansible.builtin.import_role:
        name: iss.tracker.bastion
        tasks_from: revoke
