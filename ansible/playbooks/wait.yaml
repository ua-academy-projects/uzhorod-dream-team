---
- name: Wait for SSH through IAP before gathering facts or deploying
  hosts: bastion:internal
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for SSH and the VM Python interpreter
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: "{{ ansible_ssh_timeout }}"
        sleep: 5
