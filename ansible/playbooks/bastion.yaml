---
- name: Configure bastion SSH, firewall and fail2ban
  hosts: bastion
  become: true
  serial: 1

  vars_files:
    - ../../config.json

  pre_tasks:
    - name: Validate shared deployment settings
      ansible.builtin.import_role:
        name: ../roles/validate
      tags: [always]

  roles:
    - role: ../roles/bastion
