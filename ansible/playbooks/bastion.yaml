---
- name: Configure bastion SSH, firewall and fail2ban
  hosts: bastion
  become: true
  gather_facts: false
  serial: 1

  vars_files:
    - "{{ lookup('env', 'DATAMONITOR_CONFIG') | default(playbook_dir ~ '/../../config.json', true) }}"

  pre_tasks:
    - name: Validate shared deployment settings
      ansible.builtin.import_role:
        name: validate
      tags: [always]

  roles:
    - role: datamonitor.platform.connection
    - role: bastion
