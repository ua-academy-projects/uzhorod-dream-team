- name: Configure instances
  hosts: internal
  become: true
  gather_facts: false

  vars_files:
    - "{{ lookup('env', 'DATAMONITOR_CONFIG') | default(playbook_dir ~ '/../../config.json', true) }}"
    - "{{ playbook_dir }}/../../monitoring.json"

  pre_tasks:
    - name: Validate shared deployment settings
      ansible.builtin.import_role:
        name: validate
      tags: [always]

  roles:
    - role: datamonitor.platform.connection
    - role: datamonitor.platform.common
    - role: datamonitor.platform.docker
    - role: datamonitor.platform.ops_agent
      vars:
        ops_agent_enabled: "{{ monitoring.enabled and monitoring.agent.enabled }}"
        ops_agent_config: "{{ monitoring.agent.config }}"
