---

- name: The project's secrets in each cloud in use, as the cloud says it (label/tag app=<prefix>)
  citybikes.infra.cloud_secrets:
    cloud: "{{ item }}"
    prefix: "{{ config_json.prefix }}"
    region: "{{ config_json.clouds[item].location.regions[config_json.region] }}"
  loop: "{{ secrets_clouds }}"
  register: secrets_found
  check_mode: false

- name: Every cloud in use has the project's secrets (the infrastructure makes them, empty)
  ansible.builtin.assert:
    that: secrets_empty_clouds | length == 0
    fail_msg: "No secret of the project in {{ secrets_empty_clouds | join(', ') }}: build the infrastructure first"
    quiet: true

- name: Every secret has its variable in .env (secrets_env_key of this role)
  ansible.builtin.assert:
    that: secrets_unknown | length == 0
    fail_msg: "No .env variable is known for: {{ secrets_unknown | join(', ') }} (add it to secrets_env_key)"
    quiet: true

- name: Every value is in .env
  ansible.builtin.assert:
    that: secrets_missing | length == 0
    fail_msg: "{{ secrets_env_file }} needs a value for: {{ secrets_missing | join(', ') }}"
    quiet: true

- name: The values in GCP (a new version only when a value differs from the latest)
  citybikes.infra.gcp_secret:
    name: "{{ item }}"
    value: "{{ secrets_value }}"
  vars:
    secrets_secret: "{{ item | regex_replace(secrets_prefix, '') }}"
    secrets_source: "{{ secrets_env[secrets_env_key[secrets_secret]] }}"
    secrets_value: >-
      {{ lookup('ansible.builtin.file', secrets_source | expanduser, rstrip=false)
         if secrets_secret in secrets_from_file else secrets_source }}
  loop: "{{ secrets_gcp }}"
  no_log: true

- name: The values in AWS (a new version only when a value differs from the current one)
  citybikes.infra.aws_secret:
    name: "{{ item }}"
    value: "{{ secrets_value }}"
    region: "{{ secrets_aws_region }}"
  vars:
    secrets_secret: "{{ item | regex_replace(secrets_prefix, '') }}"
    secrets_source: "{{ secrets_env[secrets_env_key[secrets_secret]] }}"
    secrets_value: >-
      {{ lookup('ansible.builtin.file', secrets_source | expanduser, rstrip=false)
         if secrets_secret in secrets_from_file else secrets_source }}
  loop: "{{ secrets_aws }}"
  no_log: true
