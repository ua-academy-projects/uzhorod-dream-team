---

secrets_env_file: "{{ citybikes_config_file | dirname | dirname }}/.env"

secrets_env_key:
  db-password: DB_PASSWORD
  redis-password: REDIS_PASSWORD
  rabbitmq-password: RABBITMQ_PASSWORD
  cloudflare-tunnel-token: CLOUDFLARE_TUNNEL_TOKEN
  cloudflare-api-token: CLOUDFLARE_API_TOKEN
  tailscale-auth-key: TAILSCALE_AUTH_KEY
  ssh-host-key: BASTION_HOST_KEY_FILE

secrets_from_file: [ssh-host-key]

secrets_env_line: '^[ \t]*([A-Z_][A-Z0-9_]*)[ \t]*=[ \t]*["'']?(.*?)["'']?[ \t]*$'
secrets_env: "{{ dict(lookup('ansible.builtin.file', secrets_env_file) | regex_findall(secrets_env_line, multiline=True)) }}"
secrets_env_filled: "{{ secrets_env | dict2items | rejectattr('value', 'eq', '') | map(attribute='key') | list }}"

secrets_clouds: >-
  {{ ([config_json.default_cloud]
      + (config_json.vms.instances.values() | map(attribute='cloud', default=config_json.default_cloud) | list)
      + ([config_json.k3s.cloud | default(config_json.default_cloud)] if (config_json.k3s.nodes | default({})) else []))
     | unique | sort }}
secrets_in: "{{ dict(secrets_found.results | map(attribute='cloud') | zip(secrets_found.results | map(attribute='names'))) }}"
secrets_empty_clouds: "{{ secrets_clouds | reject('in', secrets_in | dict2items | selectattr('value') | map(attribute='key') | list) | list }}"
secrets_gcp: "{{ secrets_in.gcp | default([]) }}"
secrets_aws: "{{ secrets_in.aws | default([]) }}"
secrets_prefix: "^{{ config_json.prefix }}-"
secrets_wanted: "{{ (secrets_gcp + secrets_aws) | map('regex_replace', secrets_prefix, '') | unique | sort }}"
secrets_unknown: "{{ secrets_wanted | reject('in', secrets_env_key) | list }}"
secrets_missing: "{{ secrets_wanted | select('in', secrets_env_key) | map('extract', secrets_env_key) | reject('in', secrets_env_filled) | list }}"

secrets_aws_region: "{{ config_json.clouds.aws.location.regions[config_json.region] }}"
