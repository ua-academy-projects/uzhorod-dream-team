---

- name: The containers' secrets may be read by this VM (vms.<name>.secrets in config.json)
  ansible.builtin.assert:
    that: compose_secrets_missing | length == 0
    fail_msg: "config.json: vms.{{ vm }}.secrets needs {{ compose_secrets_missing | join(', ') }}"
    quiet: true

- name: Folder of the application
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0755"

- name: The code of this VM's services (services/<name>/ of the repository; nothing else)
  ansible.posix.synchronize:
    src: "{{ compose_repo }}/services/"
    dest: "{{ compose_dir }}/services/"
    delete: true
    owner: false
    group: false
    use_ssh_args: true
    rsync_opts: "{{ compose_sync_filters }}"
  register: compose_code

- name: The compose file of this VM (compose.yaml)
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ compose_dir }}/compose.yaml"
    mode: "0644"

- name: The start script of this VM (the names of its secrets only, no values)
  ansible.builtin.template:
    src: up.sh.j2
    dest: "{{ compose_dir }}/up.sh"
    mode: "0750"

- name: The containers start with the VM too (systemd runs the same script at boot)
  ansible.builtin.template:
    src: citybikes.service.j2
    dest: /etc/systemd/system/citybikes.service
    mode: "0644"
  register: compose_unit

- name: systemd knows the service and starts it at boot
  ansible.builtin.systemd_service:
    name: citybikes
    enabled: true
    daemon_reload: "{{ compose_unit is changed }}"

- name: No secret file is left from before
  ansible.builtin.file:
    path: "{{ compose_dir }}/.env"
    state: absent

- name: The images of the code that changed
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "{{ compose_dir }}"
  when: compose_code is changed
  changed_when: true

- name: The containers (the secrets are read now; a container is recreated only when its image or settings changed)
  ansible.builtin.command: "{{ compose_dir }}/up.sh"
  register: compose_up
  changed_when: compose_up.stderr is search('Recreated|Created|Started|Removed')
  