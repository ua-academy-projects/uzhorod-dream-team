---

- name: Every service of this VM has its image tag (images.<service> in config.json)
  ansible.builtin.assert:
    that: compose_images_missing | length == 0
    fail_msg: "config.json: images needs a tag for {{ compose_images_missing | join(', ') }}"
    quiet: true

- name: The containers' secrets may be read by this VM (vms.<name>.secrets in config.json)
  ansible.builtin.assert:
    that: compose_secrets_missing | length == 0
    fail_msg: "config.json: vms.{{ vm }}.secrets needs {{ compose_secrets_missing | join(', ') }}"
    quiet: true

- name: Folder of the application
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    mode: "0755"

- name: No code on the VM any more (the images come built from the registry)
  ansible.builtin.file:
    path: "{{ compose_dir }}/services"
    state: absent

- name: The compose file of this VM (compose.yaml)
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ compose_dir }}/compose.yaml"
    mode: "0644"

- name: The start script of this VM (the names of its secrets only, no values)
  ansible.builtin.template:
    src: up.sh.j2
    dest: "{{ compose_dir }}/up.sh"
    mode: "0750"

- name: The containers start with the VM too (systemd runs the same script at boot)
  ansible.builtin.template:
    src: citybikes.service.j2
    dest: /etc/systemd/system/citybikes.service
    mode: "0644"
  register: compose_unit

- name: systemd knows the service and starts it at boot
  ansible.builtin.systemd_service:
    name: citybikes
    enabled: true
    daemon_reload: "{{ compose_unit is changed }}"

- name: No secret file is left from before
  ansible.builtin.file:
    path: "{{ compose_dir }}/.env"
    state: absent

- name: The images of this VM, from the registry of its cloud
  block:
    - name: Docker logged in to the registry, for the moment of the pull
      ansible.builtin.include_tasks: "registry_login_{{ compose_cloud }}.yml"

    - name: The images that are not here yet (a tag never changes its image, so a present one is the right one)
      ansible.builtin.command:
        cmd: docker compose pull --policy missing
        chdir: "{{ compose_dir }}"
      register: compose_pull
      changed_when: compose_pull.stderr is search('Pulled')

  always:
    - name: Docker logged out again
      ansible.builtin.command:
        argv: [docker, logout, "{{ compose_registry_host }}"]
      changed_when: false
      failed_when: false

- name: The containers (the secrets are read now; a container is recreated only when its image or settings changed)
  ansible.builtin.command: "{{ compose_dir }}/up.sh"
  register: compose_up
  changed_when: compose_up.stderr is search('Recreated|Created|Started|Removed')
