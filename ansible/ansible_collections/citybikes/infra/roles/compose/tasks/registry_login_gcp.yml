---

- name: Docker logged in to Artifact Registry with the VM's own account
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      curl -fsS -H 'Metadata-Flavor: Google'
      http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
      | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])'
      | docker login -u oauth2accesstoken --password-stdin https://{{ compose_registry_host }}
    executable: /bin/bash
  changed_when: false
  no_log: true
