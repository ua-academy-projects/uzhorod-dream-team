---

config_validate_schema_file: "{{ citybikes_config_file | dirname }}/config.schema.json"

config_validate_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('citybikes_vm', 'defined') | list }}"
config_validate_vms: "{{ dict(config_validate_hosts | map(attribute='vm') | zip(config_validate_hosts | map(attribute='citybikes_vm'))) }}"
config_validate_missing: "{{ config_json.vms.instances | reject('in', config_validate_vms) | list }}"

config_validate_bastions: "{{ config_validate_vms | dict2items | selectattr('value.bastion') | map(attribute='key') | list }}"
config_validate_services: "{{ config_validate_vms.values() | map(attribute='services') | flatten }}"
config_validate_tls_vm: "{{ config_validate_vms[config_json.tls.vm] | default({'services': [], 'secrets': []}) }}"

config_validate_checks:
  - msg: 'exactly one VM must have "bastion": true'
    ok: "{{ config_validate_bastions | length == 1 }}"
  - msg: 'a VM with "cloud_logging" needs "roles/logging.logWriter" (in its "roles" or in vm_defaults.roles)'
    ok: "{{ config_validate_vms.values() | selectattr('cloud_logging') | rejectattr('roles', 'contains', 'roles/logging.logWriter') | list | length == 0 }}"
  - msg: 'a service may run on one VM only'
    ok: "{{ config_validate_services | length == config_validate_services | unique | length }}"
  - msg: 'queue_backend rabbitmq needs a VM with the "rabbitmq" service'
    ok: "{{ config_json.app.queue_backend != 'rabbitmq' or 'rabbitmq' in config_validate_services }}"
  - msg: 'cache_backend redis needs a VM with the "redis" service'
    ok: "{{ config_json.app.cache_backend != 'redis' or 'redis' in config_validate_services }}"
  - msg: 'tls.vm must run "ui" and have "cloudflare-api-token" in its "secrets"'
    ok: "{{ config_json.tls.domain == '' or ('ui' in config_validate_tls_vm.services and 'cloudflare-api-token' in config_validate_tls_vm.secrets) }}"
  - msg: 'the database has no address: the Cloud SQL instance {{ config_json.prefix }}-pg does not exist yet or has no private IP'
    ok: "{{ citybikes_db_host | length > 0 }}"