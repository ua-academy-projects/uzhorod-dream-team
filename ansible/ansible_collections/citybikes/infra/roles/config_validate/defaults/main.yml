---

config_validate_schema_file: "{{ citybikes_config_file | dirname }}/config.schema.json"

config_validate_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('citybikes_vm', 'defined') | list }}"
config_validate_vms: "{{ dict(config_validate_hosts | map(attribute='vm') | zip(config_validate_hosts | map(attribute='citybikes_vm'))) }}"
config_validate_missing: "{{ citybikes_vms_expected | reject('in', config_validate_vms) | list }}"

config_validate_instances: "{{ config_json.vms.instances }}"
config_validate_services: "{{ config_validate_instances.values() | map(attribute='services', default=[]) | flatten }}"
config_validate_tls_vm: "{{ config_validate_instances[config_json.tls.vm] | default({}) }}"

config_validate_app_on_vms: "{{ config_validate_services | length > 0 }}"

config_validate_k3s: "{{ config_json.k3s | default({}) }}"
config_validate_k3s_nodes: "{{ config_validate_k3s.nodes | default({}) }}"
config_validate_k3s_control_plane: "{{ config_validate_k3s_nodes | dict2items | selectattr('value.role', 'eq', 'control_plane') | list }}"

config_validate_ip_indexes: >-
  {{ (config_validate_instances.values() | map(attribute='ip_index') | list)
     + (config_validate_k3s_nodes.values() | map(attribute='ip_index') | list)
     + ([config_validate_k3s.api_nlb_ip_index] if config_validate_k3s.api_nlb_ip_index is defined else []) }}

  {{ (config_validate_services + (['postgres'] if config_json.database.type == 'vm' and config_json.database.vm != '' else [])) | unique }}
config_validate_images_missing: "{{ config_validate_images_needed | reject('in', config_json.images | default({})) | list }}"

config_validate_checks:
  - msg: 'vms.instances has no VM "bastion": Terraform builds the bastion in every cloud in use, from vms.bastion'
    ok: "{{ 'bastion' not in config_validate_instances }}"
  - msg: 'every ip_index is its own (vms.instances, k3s.nodes, k3s.api_nlb_ip_index, vms.bastion)'
    ok: >-
      {{ config_json.vms.bastion.ip_index not in config_validate_ip_indexes
         and config_validate_ip_indexes | length == config_validate_ip_indexes | unique | length }}
  - msg: 'a VM with "cloud_logging" needs the permission "write_logs" (in its "permissions" or in vms.defaults.permissions)'
    ok: "{{ config_validate_vms.values() | selectattr('cloud_logging') | rejectattr('permissions', 'contains', 'write_logs') | list | length == 0 }}"
  - msg: 'a service may run on one VM only'
    ok: "{{ config_validate_services | length == config_validate_services | unique | length }}"
  - msg: 'queue_backend rabbitmq needs a VM with the "rabbitmq" service'
    ok: "{{ not config_validate_app_on_vms or config_json.app.queue_backend != 'rabbitmq' or 'rabbitmq' in config_validate_services }}"
  - msg: 'cache_backend redis needs a VM with the "redis" service'
    ok: "{{ not config_validate_app_on_vms or config_json.app.cache_backend != 'redis' or 'redis' in config_validate_services }}"
  - msg: 'tls.vm must run "ui" and have "cloudflare-api-token" in its "secrets"'
    ok: "{{ not config_validate_app_on_vms or config_json.tls.domain == '' or ('ui' in config_validate_tls_vm.services | default([]) and 'cloudflare-api-token' in config_validate_tls_vm.secrets | default([])) }}"
  - msg: 'database.vm must be a VM of vms.instances (or "" while no VM runs PostgreSQL)'
    ok: "{{ config_json.database.vm == '' or config_json.database.vm in config_validate_instances }}"
  - msg: 'images needs a tag for every service that runs ({{ config_validate_images_missing | join(", ") }} missing)'
    ok: "{{ config_validate_images_missing | length == 0 }}"
  - msg: 'k3s: version, api_nlb_ip_index, nginx_image, and an odd number of control_plane nodes (1, 3, 5), every role control_plane or worker'
    ok: >-
      {{ config_validate_k3s_nodes | length == 0 or (
           (['version', 'api_nlb_ip_index', 'nginx_image'] | reject('in', config_validate_k3s) | list | length == 0)
           and config_validate_k3s_control_plane | length % 2 == 1
           and (config_validate_k3s_nodes.values() | map(attribute='role') | reject('in', ['control_plane', 'worker']) | list | length == 0)) }}
  - msg: 'a k3s node and a VM of vms.instances need different names'
    ok: "{{ config_validate_k3s_nodes.keys() | select('in', config_validate_instances) | list | length == 0 }}"
