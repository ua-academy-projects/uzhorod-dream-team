- name: The configuration matches its JSON Schema (config.schema.json)
  ansible.utils.validate:
    data: "{{ config_json }}"
    criteria: "{{ lookup('ansible.builtin.file', config_validate_schema_file) | from_json }}"
    engine: ansible.utils.jsonschema

- name: Every VM of the configuration exists in GCP
  ansible.builtin.assert:
    that: config_validate_missing | length == 0
    fail_msg: "Not in GCP: {{ config_validate_missing | join(', ') }} (the VMs are made with the infrastructure, infra/)."
    quiet: true

- name: The configuration fits together
  ansible.builtin.assert:
    that: item.ok | bool
    fail_msg: "config.json: {{ item.msg }}"
    quiet: true
  loop: "{{ config_validate_checks }}"
  loop_control:
    label: "{{ item.msg }}"