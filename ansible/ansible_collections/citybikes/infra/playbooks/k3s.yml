---


- name: Validate the configuration (config.json), then an SSH key for the next minutes and your SSH config
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.config_validate
    - citybikes.infra.ssh_access
    - citybikes.infra.ssh_config

- name: The control plane, one node after the other (control-1 starts the cluster, the others join it)
  hosts: control_plane
  serial: 1
  order: sorted
  gather_facts: false
  become: true
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.k3s_control_plane

- name: The workers (the token from control-1; the control plane through the load balancer)
  hosts: workers
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.k3s_worker

- name: The cluster as a whole (once, on control-1) - every node Ready, nginx on every worker
  hosts: control_plane
  order: sorted
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.k3s_cluster
