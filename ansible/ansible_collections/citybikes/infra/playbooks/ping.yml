---

- name: Validate the configuration (config.json), then an SSH key for this run
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.config_validate
    - citybikes.infra.ssh_access

- name: Every VM answers over SSH through the bastion (the bastion itself has no shell, every jump proves it works)
  hosts: all:!bastion
  gather_facts: false
  tasks:
    - name: Ping (a small Python module runs on the VM)
      ansible.builtin.ping:
