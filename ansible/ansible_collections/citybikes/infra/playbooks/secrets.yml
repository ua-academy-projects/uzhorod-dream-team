---

- name: Validate the configuration (config.json)
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.config_validate

- name: The values of the secrets in every cloud, then the database user with the password of one of them
  hosts: localhost
  gather_facts: false
  roles:
    - citybikes.infra.secrets
    - role: citybikes.infra.cloudsql_user
      when: config_json.database.type == 'managed' and config_json.default_cloud == 'gcp'
