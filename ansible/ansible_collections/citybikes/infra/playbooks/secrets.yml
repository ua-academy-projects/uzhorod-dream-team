---

- name: Validate the configuration (config.json)
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.config_validate

- name: The values of the secrets, then the database user with the password of one of them
  hosts: localhost
  gather_facts: false
  roles:
    - citybikes.infra.gcp_secrets
    - role: citybikes.infra.cloudsql_user
      when: config_json.database.cloudsql is defined