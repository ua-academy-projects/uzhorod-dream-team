---

- name: Validate the configuration (config.json)
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config 
    - citybikes.infra.config_validate

- name: Load the configuration on every VM (config_json, for the roles below)
  hosts: all
  gather_facts: false
  roles:
    - citybikes.infra.config

- name: Bastion
  hosts: bastion
  gather_facts: false
  roles:
    - citybikes.infra.bastion

- name: VMs of the application
  hosts: app
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.docker
    - citybikes.infra.compose

- name: The site's certificate (HTTPS)
  hosts: frontend
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.tls
