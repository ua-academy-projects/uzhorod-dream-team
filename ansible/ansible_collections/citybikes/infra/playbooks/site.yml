---

- name: Load and validate the configuration (config.json)
  hosts: all
  gather_facts: false
  roles:
    - citybikes.infra.config_validate

- name: Bastion
  hosts: bastion
  gather_facts: false
  roles:
    - citybikes.infra.bastion

- name: VMs with containers
  hosts: app
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.docker

- name: VMs of the application
  hosts: app
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.docker
    - citybikes.infra.compose

- name: The site's certificate (HTTPS)
  hosts: frontend
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.tls
