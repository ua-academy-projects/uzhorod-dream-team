---

- name: Validate the configuration (config.json)
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  roles:
    - citybikes.infra.config
    - citybikes.infra.config_validate
    - citybikes.infra.ssh_access

- name: The configuration and the database on every VM but the bastion (config_json, citybikes_db_host)
  hosts: all:!bastion
  gather_facts: false
  roles:
    - citybikes.infra.config
    - citybikes.infra.database

- name: VMs of the application
  hosts: app
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.docker
    - citybikes.infra.compose
    - role: citybikes.infra.database_check
      when: "'db-password' in citybikes_vm.secrets"

- name: The site's certificate (HTTPS)
  hosts: frontend
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.tls

- name: The monitoring agent on every VM (disk, memory and CPU from inside, for Cloud Monitoring)
  hosts: all
  gather_facts: false
  become: true
  roles:
    - citybikes.infra.ops_agent
