---
- name: Wait for SSH through IAP
  ansible.builtin.wait_for_connection:
    timeout: 300
    connect_timeout: "{{ ansible_ssh_timeout | default(lookup('ansible.builtin.config', 'DEFAULT_TIMEOUT')) }}"
    sleep: 5

- name: Gather the minimal VM facts when needed
  ansible.builtin.setup:
    gather_subset: [min]
  when: ansible_facts.os_family is not defined
