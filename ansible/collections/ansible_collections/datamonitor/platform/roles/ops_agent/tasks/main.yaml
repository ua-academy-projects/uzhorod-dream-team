---
- name: Configure the enabled Ops Agent
  ansible.builtin.include_tasks: configure.yaml
  when: ops_agent_enabled | bool

- name: Stop an installed Ops Agent when disabled
  when: not (ops_agent_enabled | bool)
  block:
    - name: Discover installed services
      ansible.builtin.service_facts:

    - name: Stop and disable the Ops Agent
      ansible.builtin.systemd_service:
        name: google-cloud-ops-agent
        state: stopped
        enabled: false
      when: "'google-cloud-ops-agent.service' in ansible_facts.services"
