---
- name: Unban through a temporary admin key
  block:
    - name: Add the temporary admin key
      ansible.builtin.import_role:
        name: iss.platform.gce_temp_admin
      vars:
        gce_temp_admin_project: "{{ bastion_project }}"
        gce_temp_admin_zone: "{{ bastion_zone }}"
        gce_temp_admin_instance: "{{ inventory_hostname }}"
        gce_temp_admin_public_key: "{{ bastion_public_key }}"
        gce_temp_admin_user: "{{ bastion_admin_user }}"
        gce_temp_admin_ttl_minutes: "{{ bastion_ttl_minutes }}"

    - name: Unban the address in the sshd jail
      ansible.builtin.command:
        argv: [fail2ban-client, set, sshd, unbanip, "{{ bastion_unban_ip }}"]
      register: bastion_unban
      changed_when: bastion_unban.stdout | trim == '1'

  always:
    - name: Revoke the temporary admin key
      ansible.builtin.import_role:
        name: iss.platform.gce_temp_admin
        tasks_from: revoke
      vars:
        gce_temp_admin_project: "{{ bastion_project }}"
        gce_temp_admin_zone: "{{ bastion_zone }}"
        gce_temp_admin_instance: "{{ inventory_hostname }}"
        gce_temp_admin_user: "{{ bastion_admin_user }}"
