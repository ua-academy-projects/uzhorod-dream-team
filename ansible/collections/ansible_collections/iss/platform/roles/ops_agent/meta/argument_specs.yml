---
argument_specs:
  main:
    short_description: Install, configure or remove the Google Cloud Ops Agent.
    description:
      - Adds the repository google-cloud-ops-agent-<codename>-<version> with the key in /etc/apt/keyrings, installs google-cloud-ops-agent and writes /etc/google-cloud-ops-agent/config.yaml.
      - The agent merges this file over its built-in configuration (host metrics and syslog).
      - The VM needs a service account with roles/logging.logWriter and roles/monitoring.metricWriter.
      - When disabled, the package, repository and key are removed.
    options:
      ops_agent_enabled:
        type: bool
        default: true
        description: Install the agent (true) or remove it (false).
      ops_agent_config:
        type: dict
        default: {}
        description: Agent configuration, written as YAML.
      ops_agent_repo_codename:
        type: str
        default: ""
        description: Distribution codename of the repository; empty means the distribution_release fact.
      ops_agent_repo_version:
        type: str
        default: all
        description: Agent major version in the repository name (all, or a number such as 2).
      ops_agent_key_url:
        type: str
        default: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        description: URL of the repository signing key (ASCII-armored).
      ops_agent_key_file:
        type: str
        default: /etc/apt/keyrings/google-cloud-ops-agent.asc
        description: Local path of the signing key.
