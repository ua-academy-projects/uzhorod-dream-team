- name: Validate UI nginx configuration
  changed_when: false
  listen: Apply UI nginx configuration
  when: not ansible_check_mode
  community.docker.docker_container_exec:
    container: datamonitor-nginx
    argv:
    - nginx
    - -t
- name: Reload UI nginx
  listen: Apply UI nginx configuration
  when: not ansible_check_mode
  community.docker.docker_container_exec:
    container: datamonitor-nginx
    argv:
    - nginx
    - -s
    - reload
