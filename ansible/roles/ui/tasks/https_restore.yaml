---
- name: Check whether a certificate renewal service is available
  ansible.builtin.stat:
    path: /etc/systemd/system/datamonitor-ip-https.service
  register: ui_restore_renewal_service

- name: Check whether a certificate renewal timer is available
  ansible.builtin.stat:
    path: /etc/systemd/system/datamonitor-ip-https.timer
  register: ui_restore_renewal_timer

- name: Restore the available renewal timer after successful or failed deployment
  ansible.builtin.systemd_service:
    name: datamonitor-ip-https.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - ui_restore_renewal_service.stat.isreg | default(false)
    - ui_restore_renewal_timer.stat.isreg | default(false)
