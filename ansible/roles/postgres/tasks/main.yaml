---
- name: Select the services required on the database VM
  ansible.builtin.set_fact:
    postgres_services: >-
      {{ (['postgres'] if database.provider == 'container' else []) +
         (['rabbitmq', 'redis'] if compute.application.app_backend == 'hybrid' else []) }}

- name: Get application code
  ansible.builtin.include_role:
    name: datamonitor.platform.app_source
  vars:
    app_source_dir: "{{ postgres_app_dir }}"
    app_source_repo: "{{ compute.application.repo_url }}"
    app_source_ref: "{{ app_release_commit | default(compute.application.repo_branch) }}"

- name: Read the shared Compose service definitions
  ansible.builtin.slurp:
    src: "{{ postgres_compose_dir }}/docker-compose.yml"
  register: postgres_compose_source

- name: Parse the shared Compose configuration
  ansible.builtin.set_fact:
    postgres_compose_base: "{{ postgres_compose_source.content | b64decode | from_yaml }}"

- name: Fetch the PostgreSQL and RabbitMQ environment using the VM service account
  ansible.builtin.include_role:
    name: datamonitor.platform.secret_access
  vars:
    secret_access_project: "{{ project_id }}"
    secret_access_secret_id: "{{ secret_manager.services.postgres.secret_id }}"
    secret_access_dest: "{{ postgres_compose_dir }}/postgres/.env"
  when: not ansible_check_mode

- name: Render the database VM Compose configuration
  ansible.builtin.include_role:
    name: datamonitor.platform.compose_app
    tasks_from: render.yaml
  vars:
    compose_app_dir: "{{ postgres_compose_dir }}"
    compose_app_template: "{{ deployment_root }}/ansible/roles/postgres/templates/compose.postgres.yaml.j2"
    compose_app_files: [compose.postgres.yaml]

- name: Stop services no longer required without deleting containers or volumes
  community.docker.docker_compose_v2:
    project_src: "{{ postgres_compose_dir }}"
    files: [compose.postgres.yaml]
    env_files: [postgres/.env]
    profiles: [database]
    services: "{{ ['postgres', 'rabbitmq', 'redis'] | difference(postgres_services) }}"
    state: stopped
    timeout: "{{ postgres_wait_timeout }}"
  no_log: true
  when:
    - not ansible_check_mode
    - postgres_services | length < 3

- name: Start the selected database VM containers
  ansible.builtin.include_role:
    name: datamonitor.platform.compose_app
    tasks_from: start.yaml
  vars:
    compose_app_dir: "{{ postgres_compose_dir }}"
    compose_app_files: [compose.postgres.yaml]
    compose_app_env_files: [postgres/.env]
    compose_app_profiles: [database]
    compose_app_services: "{{ postgres_services }}"
    compose_app_wait_timeout: "{{ postgres_wait_timeout }}"
  when: postgres_services | length > 0

- name: Remove the legacy shared environment
  ansible.builtin.include_role:
    name: datamonitor.platform.compose_app
    tasks_from: cleanup.yaml
  vars:
    compose_app_dir: "{{ postgres_compose_dir }}"
