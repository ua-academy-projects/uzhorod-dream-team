---
postgres_app_dir: "{{ deployment_app_dir }}"
postgres_compose_dir: "{{ deployment_compose_dir }}"
postgres_bind_ip: "{{ compute.instances.postgres.network_ip }}"
postgres_port: "{{ ports.postgres }}"
redis_port: "{{ ports.redis }}"
rabbitmq_port: "{{ ports.rabbitmq }}"
postgres_wait_timeout: 360
