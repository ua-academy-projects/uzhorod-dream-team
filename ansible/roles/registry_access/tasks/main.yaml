---
- name: Validate the deployment release manifest
  ansible.builtin.include_role:
    name: release_manifest
  vars:
    release_manifest_commit: "{{ app_release_commit | default('') }}"
    release_manifest_images: "{{ app_images | default({}) }}"

- name: Authenticate the VM to Artifact Registry
  when: not ansible_check_mode
  block:
    - name: Read a short-lived token from this VM service account
      ansible.builtin.uri:
        url: http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token
        headers:
          Metadata-Flavor: Google
        use_proxy: false
        use_netrc: false
        return_content: true
        timeout: 10
      register: registry_token
      until: registry_token is succeeded
      retries: 4
      delay: 5
      changed_when: false
      no_log: true

    - name: Log in to this regional Docker registry
      community.docker.docker_login:
        registry_url: "{{ region }}-docker.pkg.dev"
        username: oauth2accesstoken
        password: "{{ registry_token.json.access_token }}"
      no_log: true
  always:
    - name: Clear the temporary registry token
      ansible.builtin.set_fact:
        registry_token: {}
      no_log: true
