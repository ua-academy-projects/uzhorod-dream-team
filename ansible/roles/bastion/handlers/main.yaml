---
- name: Validate SSH before restart
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false
  listen: Restart bastion SSH
  when: not ansible_check_mode

- name: Restart bastion SSH service
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: restarted
    daemon_reload: true
  listen: Restart bastion SSH
  when: not ansible_check_mode

- name: Validate fail2ban before restart
  ansible.builtin.command:
    argv: [/usr/bin/fail2ban-client, -t]
  changed_when: false
  listen: Restart bastion fail2ban
  when: not ansible_check_mode

- name: Restart bastion fail2ban service
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: restarted
  listen: Restart bastion fail2ban
  when: not ansible_check_mode
