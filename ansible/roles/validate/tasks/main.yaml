---
- name: Validate shared settings on the controller before changing a VM
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  run_once: true
  when: not (hostvars['localhost'].datamonitor_config_validated | default(false))
  tags: [always]
  block:
    - name: Validate config.json against its tracked schema
      ansible.utils.validate:
        data: "{{ lookup('ansible.builtin.file', (lookup('env', 'DATAMONITOR_CONFIG') | default(deployment_root ~ '/config.json', true))) | from_json }}"
        criteria: "{{ lookup('ansible.builtin.file', role_path ~ '/files/config.schema.json') | from_json }}"
        engine: ansible.utils.jsonschema

    - name: Validate monitoring.json against its tracked schema
      ansible.utils.validate:
        data: "{{ lookup('ansible.builtin.file', deployment_root ~ '/monitoring.json') | from_json }}"
        criteria: "{{ lookup('ansible.builtin.file', role_path ~ '/files/monitoring.schema.json') | from_json }}"
        engine: ansible.utils.jsonschema

    - name: Require dashboard widgets to reference configured metrics
      ansible.builtin.assert:
        quiet: true
        that:
          - monitoring_settings.dashboard.widgets | map(attribute='metric') | difference((monitoring_settings.metrics.keys() | list) + ['uptime']) | length == 0
      vars:
        monitoring_settings: "{{ (lookup('ansible.builtin.file', deployment_root ~ '/monitoring.json') | from_json).monitoring }}"

    - name: Check address, zone and firewall consistency
      ansible.builtin.assert:
        quiet: true
        that:
          - database.provider in ['cloud_sql', 'container']
          - compute.application.app_backend in ['hybrid', 'postgres']
          - zone.startswith(region ~ '-')
          - network.subnet.region == region
          - compute.instances.values() | map(attribute='network_ip') | list | unique | length == compute.instances | length
          - compute.instances.values() | map(attribute='name') | list | unique | length == compute.instances | length
          - firewall.rules | map(attribute='name') | list | unique | length == firewall.rules | length
          - not compute.instances.bastion.public_ip
          - not compute.instances.bastion.static_public_ip
          - compute.instances.bastion.startup.type == 'bastion'
          - compute.instances.fetcher.startup.type == 'none'
          - compute.instances.history.startup.type == 'none'
          - compute.instances.postgres.startup.type == 'none'
          - compute.instances.ui.startup.type == 'none'
        fail_msg: Use supported database/backend modes, unique VM names/IPs, unique firewall names, a zone in the configured region and a private IAP bastion.

    - name: Require firewall tags to match configured VM tags
      ansible.builtin.assert:
        quiet: true
        that:
          - (item.target_tags | default([]) + item.source_tags | default([])) | difference(compute.instances.values() | map(attribute='tags') | flatten | unique) | length == 0
      loop: "{{ firewall.rules }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require valid effective ports in firewall rules
      ansible.builtin.assert:
        quiet: true
        that:
          - effective_ports | length > 0
          - effective_ports | map('int') | min > 0
          - effective_ports | map('int') | max < 65536
      loop: "{{ firewall.rules | subelements('allowed') }}"
      loop_control:
        label: "{{ item.0.name }}"
      vars:
        effective_ports: "{{ item.1.ports | default(item.1.port_keys | default([]) | map('extract', deployment_ports) | list) }}"

    - name: Require essential firewall routes to use their configured service ports
      ansible.builtin.assert:
        quiet: true
        that:
          - matching_rules | length == 1
          - matching_rules[0].allowed | map(attribute='port_keys', default=[]) | flatten | sort == item.value | sort
          - matching_rules[0].allowed | map(attribute='ports', default=[]) | flatten | length == 0
        fail_msg: Keep the required firewall routes and reference the matching shared port keys.
      loop: "{{ required_firewall_ports | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        matching_rules: "{{ firewall.rules | selectattr('name', 'equalto', item.key) | list }}"
        required_firewall_ports:
          allow-iap-bastion: [bastion_ssh]
          allow-bastion-ssh: [ssh]
          allow-ui-web: [http, https]
          allow-ui-history: [history]
          allow-history-fetcher: [fetcher]
          allow-app-postgres: [postgres]
          allow-app-rabbitmq: [rabbitmq]
          allow-ui-redis: [redis]

    - name: Require application port overrides to agree with shared configuration
      ansible.builtin.assert:
        quiet: true
        that:
          - lookup('ansible.builtin.vars', item.key, default=item.value) | int == item.value | int
        fail_msg: Configure service ports in config.json ports instead of overriding individual role ports.
      loop: "{{ service_ports | dict2items }}"
      vars:
        service_ports:
          fetcher_port: "{{ ports.fetcher }}"
          history_port: "{{ ports.history }}"
          postgres_port: "{{ ports.postgres }}"
          rabbitmq_port: "{{ ports.rabbitmq }}"
          redis_port: "{{ ports.redis }}"
          ui_port: "{{ ports.ui }}"
          ui_http_port: "{{ ports.http }}"
          ui_https_port: "{{ ports.https }}"

    - name: Remember successful validation for this Ansible execution
      ansible.builtin.set_fact:
        datamonitor_config_validated: true
      delegate_facts: true
