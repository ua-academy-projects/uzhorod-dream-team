---
- name: Check that the operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: The common role supports Debian and Ubuntu VMs.

- name: Install basic packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ common_cache_valid_time }}"
