---
- name: Deploy the fetcher HTTP service
  ansible.builtin.include_role:
    name: http_service
  vars:
    http_service_name: fetcher
    http_service_app_dir: "{{ fetcher_app_dir }}"
    http_service_compose_dir: "{{ fetcher_compose_dir }}"
    http_service_port: "{{ fetcher_port }}"
    http_service_wait_timeout: "{{ fetcher_wait_timeout }}"
    http_service_template: "{{ deployment_root }}/ansible/roles/fetcher/templates/compose.fetcher.yaml.j2"
