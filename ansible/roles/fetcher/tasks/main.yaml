---
- name: Validate Fetcher port
  ansible.builtin.assert:
    that:
      - fetcher_port | int > 0
      - fetcher_port | int < 65536
    fail_msg: Fetcher must use a port between 1 and 65535.

- name: Validate release and authenticate to Artifact Registry
  ansible.builtin.include_role:
    name: registry_access

- name: Get application code
  ansible.builtin.include_role:
    name: datamonitor.platform.app_source
  vars:
    app_source_dir: "{{ fetcher_app_dir }}"
    app_source_repo: "{{ compute.application.repo_url }}"
    app_source_ref: "{{ app_release_commit | default(compute.application.repo_branch) }}"

- name: Fetch the Fetcher environment using the VM service account
  ansible.builtin.include_role:
    name: datamonitor.platform.secret_access
  vars:
    secret_access_project: "{{ project_id }}"
    secret_access_secret_id: "{{ secret_manager.services.fetcher.secret_id }}"
    secret_access_dest: "{{ fetcher_compose_dir }}/fetcher/.env"
  when: not ansible_check_mode

- name: Deploy Fetcher containers
  ansible.builtin.include_role:
    name: datamonitor.platform.compose_app
  vars:
    compose_app_dir: "{{ fetcher_compose_dir }}"
    compose_app_template: "{{ deployment_root }}/ansible/roles/fetcher/templates/compose.fetcher.yaml.j2"
    compose_app_files: [compose.fetcher.yaml]
    compose_app_services: [fetcher]
    compose_app_wait_timeout: "{{ fetcher_wait_timeout }}"

- name: Wait for the Fetcher HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ compute.instances.fetcher.network_ip }}:{{ fetcher_port }}/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  register: fetcher_health
  until: fetcher_health is succeeded
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Remove the legacy shared environment
  ansible.builtin.include_role:
    name: datamonitor.platform.compose_app
    tasks_from: cleanup.yaml
  vars:
    compose_app_dir: "{{ fetcher_compose_dir }}"
