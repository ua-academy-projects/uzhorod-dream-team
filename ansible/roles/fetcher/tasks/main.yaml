---
- name: Validate Fetcher deployment settings
  ansible.builtin.assert:
    that:
      - compute.instances.fetcher.startup.type == 'none'
      - compute.application.app_backend in ['hybrid', 'postgres']
      - database.provider in ['cloud_sql', 'container']
      - fetcher_port | int > 0
      - fetcher_port | int < 65536
    fail_msg: Fetcher must use Ansible deployment and valid backend, database and port settings.

- name: Validate release and authenticate to Artifact Registry
  ansible.builtin.include_role:
    name: "{{ role_path }}/../registry_access"

- name: Get application code
  ansible.builtin.include_role:
    name: "{{ role_path }}/../app_source"
  vars:
    app_source_dir: "{{ fetcher_app_dir }}"

- name: Fetch the Fetcher environment using the VM service account
  ansible.builtin.include_role:
    name: "{{ role_path }}/../secret_access"
  vars:
    secret_access_service: fetcher
    secret_access_dest: "{{ fetcher_compose_dir }}/fetcher/.env"
  when: not ansible_check_mode

- name: Deploy Fetcher containers
  ansible.builtin.include_role:
    name: "{{ role_path }}/../compose_app"
  vars:
    compose_app_dir: "{{ fetcher_compose_dir }}"
    compose_app_template: "{{ role_path }}/../fetcher/templates/compose.fetcher.yaml.j2"
    compose_app_files: [compose.fetcher.yaml]
    compose_app_services: [fetcher]
    compose_app_build: never
    compose_app_pull: missing
    compose_app_wait_timeout: "{{ fetcher_wait_timeout }}"

- name: Wait for the Fetcher HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ compute.instances.fetcher.network_ip }}:{{ fetcher_port }}/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  register: fetcher_health
  until: fetcher_health is succeeded
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Remove the legacy shared environment
  ansible.builtin.include_role:
    name: "{{ role_path }}/../compose_app"
    tasks_from: cleanup.yaml
  vars:
    compose_app_dir: "{{ fetcher_compose_dir }}"
