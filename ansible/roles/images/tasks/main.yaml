---
- name: Create the release artifact directory
  ansible.builtin.file:
    path: '{{ build_release_file | dirname }}'
    state: directory
- name: Check for an existing release manifest
  ansible.builtin.stat:
    path: '{{ build_release_file }}'
  register: build_manifest_stat
- name: Validate an existing release before reusing it
  ansible.builtin.include_role:
    name: release_manifest
  vars:
    release_manifest_commit: "{{ cached_release.app_release_commit | default('') }}"
    release_manifest_images: "{{ cached_release.app_images | default({}) }}"
    cached_release: "{{ lookup('ansible.builtin.file', build_release_file) | from_json }}"
  when: build_manifest_stat.stat.exists

- name: Build and publish a new release when missing
  when: not build_manifest_stat.stat.exists
  block:
    - name: Require a real build rather than check mode
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use validate.yaml for a read-only configuration check.
    - name: Read the source commit
      ansible.builtin.command:
        argv:
          - git
          - -C
          - '{{ build_source_dir }}'
          - log
          - '-1'
          - --format=%H
          - --
          - DataFetcher
          - ':(exclude)DataFetcher/**/*.md'
          - ':(exclude)DataFetcher/*.md'
      register: build_commit
      changed_when: false
    - name: Check application source for uncommitted or untracked files
      ansible.builtin.command:
        argv:
          - git
          - -C
          - '{{ build_source_dir }}'
          - status
          - --porcelain
          - --untracked-files=all
          - --
          - DataFetcher
          - ':(exclude)DataFetcher/**/*.md'
          - ':(exclude)DataFetcher/*.md'
      register: build_dirty
      changed_when: false
    - name: Require committed application source for a reproducible release
      ansible.builtin.assert:
        that:
          - build_commit.stdout is match('^[0-9a-f]{40}$')
          - build_dirty.stdout | length == 0
        fail_msg: Commit and push DataFetcher changes before building; the VMs also need this commit for Compose, SQL
          and nginx assets.
    - name: Build the three application images on the controller
      loop: '{{ build_services }}'
      community.docker.docker_image:
        name: '{{ build_registry }}/{{ item }}'
        tag: '{{ build_commit.stdout }}'
        source: build
        build:
          path: '{{ build_source_dir }}/DataFetcher/{{ item }}'
          platform: linux/amd64
          pull: false
    - name: Publish images using a short-lived controller ADC token
      block:
        - name: Read the publisher token
          ansible.builtin.command:
            argv:
              - gcloud
              - auth
              - application-default
              - print-access-token
          register: build_token
          changed_when: false
          no_log: true
        - name: Authenticate the local Docker client
          community.docker.docker_login:
            registry_url: '{{ region }}-docker.pkg.dev'
            username: oauth2accesstoken
            password: '{{ build_token.stdout }}'
          no_log: true
        - name: Push the immutable commit tags
          loop: '{{ build_services }}'
          community.docker.docker_image_push:
            name: '{{ build_registry }}/{{ item }}'
            tag: '{{ build_commit.stdout }}'
      always:
        - name: Clear the publisher token from temporary variables
          ansible.builtin.set_fact:
            build_token: {}
          no_log: true
    - name: Read the published image digests
      community.docker.docker_image_info:
        name: '{{ build_registry }}/{{ item }}:{{ build_commit.stdout }}'
      loop: '{{ build_services }}'
      register: build_image_info
      no_log: true
    - name: Start the release manifest
      ansible.builtin.set_fact:
        build_manifest:
          app_release_commit: '{{ build_commit.stdout }}'
          app_images: {}
    - name: Add each repository digest to the release manifest
      ansible.builtin.set_fact:
        build_manifest: >-
          {{ build_manifest | combine({
            'app_images': build_manifest.app_images | combine({
              item.item: item.images[0].RepoDigests
                | select('match', '^' ~ ((build_registry ~ '/' ~ item.item) | regex_escape)
                  ~ '@sha256:[0-9a-f]{64}$') | first
            })
          }) }}
      loop: '{{ build_image_info.results }}'
      loop_control:
        label: '{{ item.item }}'
      no_log: true
    - name: Validate the completed release before saving it
      ansible.builtin.include_role:
        name: release_manifest
      vars:
        release_manifest_commit: "{{ build_manifest.app_release_commit }}"
        release_manifest_images: "{{ build_manifest.app_images }}"
    - name: Write the nonsecret release manifest for deployment and rollback
      ansible.builtin.copy:
        content: "{{ build_manifest | to_nice_json }}\n"
        dest: "{{ build_release_file }}"
        mode: '0644'
    - name: Show the manifest path
      ansible.builtin.debug:
        msg: "Release manifest: {{ build_release_file }}"
