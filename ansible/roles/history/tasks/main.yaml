---
- name: Deploy the history HTTP service
  ansible.builtin.include_role:
    name: http_service
  vars:
    http_service_name: history
    http_service_app_dir: "{{ history_app_dir }}"
    http_service_compose_dir: "{{ history_compose_dir }}"
    http_service_port: "{{ history_port }}"
    http_service_wait_timeout: "{{ history_wait_timeout }}"
    http_service_template: "{{ deployment_root }}/ansible/roles/history/templates/compose.history.yaml.j2"
