---
- name: Validate History deployment settings
  ansible.builtin.assert:
    that:
      - compute.instances.history.startup.type == 'none'
      - compute.application.app_backend in ['hybrid', 'postgres']
      - database.provider in ['cloud_sql', 'container']
      - history_port | int > 0
      - history_port | int < 65536
    fail_msg: History must use Ansible deployment and valid backend, database and port settings.

- name: Get the configured application revision
  ansible.builtin.git:
    repo: "{{ compute.application.repo_url }}"
    version: "{{ compute.application.repo_branch }}"
    dest: "{{ history_app_dir }}"
    force: false
  register: history_source

- name: Check for a previously deployed revision
  ansible.builtin.stat:
    path: "{{ history_revision_file }}"
  register: history_revision_stat

- name: Read the previously deployed revision
  ansible.builtin.slurp:
    src: "{{ history_revision_file }}"
  register: history_deployed_revision
  when: history_revision_stat.stat.exists

- name: Fetch the History environment using the VM service account
  ansible.builtin.include_role:
    name: "{{ role_path }}/../secret_access"
  vars:
    secret_access_service: history
    secret_access_dest: "{{ history_compose_dir }}/history/.env"
  when: not ansible_check_mode

- name: Write the History-only Compose configuration
  ansible.builtin.template:
    src: compose.history.yaml.j2
    dest: "{{ history_compose_dir }}/compose.history.yaml"
    owner: root
    group: root
    mode: '0644'

- name: Build and start History
  community.docker.docker_compose_v2:
    project_src: "{{ history_compose_dir }}"
    files: [compose.history.yaml]
    services: [history]
    dependencies: false
    state: present
    build: >-
      {{ 'always' if (history_force_build | bool or
         (history_deployed_revision.content | default('') | b64decode | trim)
         != history_source.after) else 'policy' }}
    pull: never
    wait: true
    wait_timeout: "{{ history_wait_timeout }}"
  no_log: true
  when: not ansible_check_mode

- name: Wait for the History HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ compute.instances.history.network_ip }}:{{ history_port }}/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  register: history_health
  until: history_health is succeeded
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Record the revision only after successful deployment and HTTP check
  ansible.builtin.copy:
    content: "{{ history_source.after }}\n"
    dest: "{{ history_revision_file }}"
    owner: root
    group: root
    mode: '0644'
  when: not ansible_check_mode

- name: Remove the legacy shared environment after successful deployment
  ansible.builtin.file:
    path: "{{ history_compose_dir }}/.env"
    state: absent
  no_log: true
  diff: false
  when: not ansible_check_mode
