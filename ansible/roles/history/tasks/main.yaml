---
- name: Validate History deployment settings
  ansible.builtin.assert:
    that:
      - compute.instances.history.startup.type == 'none'
      - compute.application.app_backend in ['hybrid', 'postgres']
      - database.provider in ['cloud_sql', 'container']
      - history_port | int > 0
      - history_port | int < 65536
    fail_msg: History must use Ansible deployment and valid backend, database and port settings.

- name: Validate release and authenticate to Artifact Registry
  ansible.builtin.include_role:
    name: "{{ role_path }}/../registry_access"

- name: Get application code
  ansible.builtin.include_role:
    name: "{{ role_path }}/../app_source"
  vars:
    app_source_dir: "{{ history_app_dir }}"

- name: Fetch the History environment using the VM service account
  ansible.builtin.include_role:
    name: "{{ role_path }}/../secret_access"
  vars:
    secret_access_service: history
    secret_access_dest: "{{ history_compose_dir }}/history/.env"
  when: not ansible_check_mode

- name: Deploy History containers
  ansible.builtin.include_role:
    name: "{{ role_path }}/../compose_app"
  vars:
    compose_app_dir: "{{ history_compose_dir }}"
    compose_app_template: "{{ role_path }}/../history/templates/compose.history.yaml.j2"
    compose_app_files: [compose.history.yaml]
    compose_app_services: [history]
    compose_app_build: never
    compose_app_pull: missing
    compose_app_wait_timeout: "{{ history_wait_timeout }}"

- name: Wait for the History HTTP endpoint
  ansible.builtin.uri:
    url: "http://{{ compute.instances.history.network_ip }}:{{ history_port }}/health"
    use_proxy: false
    status_code: 200
    timeout: 5
  register: history_health
  until: history_health is succeeded
  retries: 12
  delay: 5
  when: not ansible_check_mode

- name: Remove the legacy shared environment
  ansible.builtin.include_role:
    name: "{{ role_path }}/../compose_app"
    tasks_from: cleanup.yaml
  vars:
    compose_app_dir: "{{ history_compose_dir }}"
