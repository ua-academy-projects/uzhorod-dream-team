[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = {version = "1.0.104", default-features = true}
async-trait = "0.1.92"
axum = {version = "0.8.9", features = []}
axum-server = "0.8.0"
dotenvy = "0.15.7"
lapin = "4.12.2"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = {version = "0.13.5", features = ["json", "form"]}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = {version = "1.53.3", features = ["macros", "net", "sync", "rt-multi-thread"]}
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["json"]}
uuid = { version = "1.28.0", features = ["v4", "serde"] }
