- name: History VM
  hosts: history
  gather_facts: false
  roles:
    - role: kyiv_air.platform.base
    - role: kyiv_air.platform.secrets
      secrets_names: "{{ cfg.vm.history.secrets }}"
  tasks:
    - name: Cloud SQL Auth Proxy
      ansible.builtin.include_role:
        name: kyiv_air.platform.container
      vars:
        container_name: kyiv-air-sql-proxy
        container_image: "{{ kyiv_air_sql_proxy_image }}"
        container_pull: missing
        container_state: "{{ 'started' if kyiv_air_cloud_sql | bool else 'absent' }}"
        container_command:
          - --address=0.0.0.0
          - --port=5432
          - --psc
          - "{{ kyiv_air_cloud_sql_connection }}"

    - name: Database migrations
      ansible.builtin.include_role:
        name: kyiv_air.platform.migrate

    - name: Build the History environment
      ansible.builtin.set_fact:
        history_env: >-
          {{ (cfg.vm.history.env | default({})) | combine({
            'PORT': '8081',
            'POSTGRES_ONLY': (kyiv_air_postgres_only | bool) | string | lower,
            'DATABASE_URL': 'postgres://kyiv_air:' ~ kyiv_air_secrets['postgres-history-password'] ~ '@' ~ kyiv_air_db_host ~ ':5432/' ~ kyiv_air_database ~ '?sslmode=disable',
            'FETCHER_SERVICE_URL': 'http://' ~ cfg.vm.fetcher.private_ip ~ ':8080',
            'ALLOWED_ORIGINS': (((cfg.vm.history.env | default({})).ALLOWED_ORIGINS | default('')).split(',') | select | list + [kyiv_air_ui_origin]) | unique | join(',')
          }) | combine({} if kyiv_air_postgres_only | bool else {
            'REDIS_URL': 'redis://:' ~ kyiv_air_secrets['redis-password'] ~ '@' ~ cfg.vm.db.private_ip ~ ':6379/0',
            'RABBITMQ_URL': 'amqp://kyiv_air:' ~ kyiv_air_secrets['rabbitmq-password'] ~ '@' ~ cfg.vm.db.private_ip ~ ':5672/kyiv-air'
          }) }}
      no_log: true

    - name: Wait for the History database user
      community.docker.docker_container:
        name: kyiv-air-history-probe
        image: "{{ cfg.images.POSTGRES_CLIENT_IMAGE }}"
        networks:
          - name: "{{ kyiv_air_network }}"
        env:
          DATABASE_URL: "{{ history_env.DATABASE_URL }}"
          PGCONNECT_TIMEOUT: "3"
        entrypoint: [sh, -c]
        command: ['psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT id FROM sessions LIMIT 0"']
        detach: false
        cleanup: true
      register: history_db_probe
      until: history_db_probe is succeeded
      retries: "{{ kyiv_air_probe_retries | int }}"
      delay: "{{ kyiv_air_probe_delay }}"
      changed_when: false
      no_log: true

    - name: Wait for RabbitMQ
      ansible.builtin.wait_for:
        host: "{{ cfg.vm.db.private_ip }}"
        port: 5672
        timeout: "{{ cfg.vm_options.probe_timeout | default(600) }}"
      when: not (kyiv_air_postgres_only | bool)

    - name: Wait for Redis
      community.docker.docker_container:
        name: kyiv-air-redis-probe
        image: "{{ cfg.images.REDIS_IMAGE }}"
        networks:
          - name: "{{ kyiv_air_network }}"
        env:
          REDISCLI_AUTH: "{{ kyiv_air_secrets['redis-password'] }}"
        command: [redis-cli, -h, "{{ cfg.vm.db.private_ip }}", PING]
        detach: false
        cleanup: true
        output_logs: true
      register: history_redis_probe
      until: history_redis_probe is succeeded and 'PONG' in (history_redis_probe.container.Output | default(''))
      retries: "{{ kyiv_air_probe_retries | int }}"
      delay: "{{ kyiv_air_probe_delay }}"
      changed_when: false
      no_log: true
      when: not (kyiv_air_postgres_only | bool)

    - name: History service
      ansible.builtin.include_role:
        name: kyiv_air.platform.container
      vars:
        container_name: kyiv-air-history
        container_image: "{{ kyiv_air_registry }}/history:{{ kyiv_air_image_version }}"
        container_hardened: true
        container_ports:
          - "{{ cfg.vm.history.private_ip }}:8081:8081"
          - 127.0.0.1:8081:8081
        container_env: "{{ history_env }}"
        container_probe_url: http://127.0.0.1:8081/health

    - name: History API probes
      ansible.builtin.uri:
        url: "{{ item }}"
        timeout: 3
      loop:
        - http://127.0.0.1:8081/api/v1/locations
        - http://127.0.0.1:8081/api/v1/session
      register: history_api
      until: history_api.status == 200
      retries: "{{ kyiv_air_probe_retries | int }}"
      delay: "{{ kyiv_air_probe_delay }}"
      changed_when: false
