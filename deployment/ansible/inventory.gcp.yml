plugin: kyiv_air.platform.gcp
auth_kind: application

hostnames:
  - name

keyed_groups:
  - key: tags['items']
    prefix: ""
    separator: ""

groups:
  internal: "'bastion' not in (tags['items'] | default([]))"
  ubuntu: "disks | selectattr('boot') | map(attribute='licenses', default=[]) | flatten | select('search', '/ubuntu') | list | length > 0"

compose:
  ansible_host: >-
    networkInterfaces[0].accessConfigs[0].natIP
    if 'bastion' in (tags['items'] | default([]))
    else networkInterfaces[0].networkIP
