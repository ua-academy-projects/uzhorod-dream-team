- name: UI VM
  hosts: ui
  gather_facts: false
  roles:
    - role: kyiv_air.platform.base
    - role: kyiv_air.platform.secrets
      secrets_names: "{{ cfg.vm.ui.secrets }}"
    - role: kyiv_air.platform.certbot
  tasks:
    - name: Wait for the History VM
      ansible.builtin.uri:
        url: "http://{{ cfg.vm.history.private_ip }}:8081/health"
        timeout: 3
      register: ui_history_probe
      until: ui_history_probe.status == 200
      retries: "{{ kyiv_air_probe_retries | int }}"
      delay: "{{ kyiv_air_probe_delay }}"
      changed_when: false

    - name: Install the nginx template
      ansible.builtin.copy:
        src: ui.conf.template
        dest: "{{ kyiv_air_config_dir }}/ui.conf.template"
        mode: "0644"

    - name: Build the UI environment
      ansible.builtin.set_fact:
        ui_env: "{{ (cfg.vm.ui.env | default({})) | combine({'HISTORY_URL': 'http://' ~ cfg.vm.history.private_ip ~ ':8081', 'CERTBOT_DOMAIN': cfg.cloudflare.domain}) }}"
        ui_mounts:
          - type: bind
            source: /etc/letsencrypt
            target: /etc/letsencrypt
            read_only: true
          - type: bind
            source: "{{ kyiv_air_config_dir }}/ui.conf.template"
            target: /etc/nginx/templates/default.conf.template
            read_only: true

    - name: Validate the nginx configuration
      community.docker.docker_container:
        name: kyiv-air-ui-check
        image: "{{ kyiv_air_registry }}/ui:{{ kyiv_air_image_version }}"
        pull: always
        networks:
          - name: "{{ kyiv_air_network }}"
        env: "{{ ui_env }}"
        groups: ["{{ kyiv_air_certificate_gid }}"]
        mounts: "{{ ui_mounts }}"
        command: [nginx, -t]
        detach: false
        cleanup: true
      changed_when: false

    - name: UI service
      ansible.builtin.include_role:
        name: kyiv_air.platform.container
      vars:
        container_name: kyiv-air-ui
        container_image: "{{ kyiv_air_registry }}/ui:{{ kyiv_air_image_version }}"
        container_ports:
          - "{{ cfg.vm.ui.private_ip }}:80:8080"
          - 127.0.0.1:80:8080
          - "{{ cfg.vm.ui.private_ip }}:443:8443"
          - 127.0.0.1:443:8443
        container_env: "{{ ui_env }}"
        container_groups: ["{{ kyiv_air_certificate_gid }}"]
        container_mounts: "{{ ui_mounts }}"
        container_probe_url: http://127.0.0.1/

    - name: UI HTTPS probes
      ansible.builtin.command:
        argv:
          - curl
          - -fsS
          - --connect-timeout
          - "2"
          - --max-time
          - "3"
          - --noproxy
          - "*"
          - --resolve
          - "{{ cfg.cloudflare.domain }}:443:{{ cfg.vm.ui.private_ip }}"
          - "https://{{ cfg.cloudflare.domain }}{{ item }}"
      loop: ["/", /api/v1/session]
      register: ui_https
      until: ui_https.rc == 0
      retries: "{{ kyiv_air_probe_retries | int }}"
      delay: "{{ kyiv_air_probe_delay }}"
      changed_when: false
