- name: Read a registry access token for the local gcloud account
  ansible.builtin.command: gcloud auth print-access-token
  register: images_token
  changed_when: false
  no_log: true

- name: Log in to Artifact Registry
  community.docker.docker_login:
    registry_url: "{{ kyiv_air_registry_host }}"
    username: oauth2accesstoken
    password: "{{ images_token.stdout }}"
  changed_when: false
  no_log: true

- name: Build images
  community.docker.docker_image_build:
    name: "{{ kyiv_air_registry }}/{{ item.name }}"
    tag: "{{ kyiv_air_image_version }}"
    path: "{{ images_source_dir }}/{{ item.context }}"
    target: "{{ item.target | default(omit) }}"
    platform: "{{ images_platform }}"
    rebuild: always
  loop: "{{ images_components | selectattr('name', 'in', images_only | default(images_components | map(attribute='name'))) | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Push images
  community.docker.docker_image_push:
    name: "{{ kyiv_air_registry }}/{{ item.name }}"
    tag: "{{ kyiv_air_image_version }}"
  loop: "{{ images_components | selectattr('name', 'in', images_only | default(images_components | map(attribute='name'))) | list }}"
  loop_control:
    label: "{{ item.name }}"
