- name: Cloud SQL Auth Proxy
  ansible.builtin.include_role:
    name: kyiv_air.platform.sql_proxy

- name: Database migrations
  ansible.builtin.include_role:
    name: kyiv_air.platform.migrate

- name: Build the History environment
  vars:
    history_database_url: "postgres://kyiv_air:{{ kyiv_air_secrets['postgres-history-password'] }}@{{ database_host }}:5432/{{ config_json.database.name }}?sslmode=disable"
    history_redis_url: "redis://:{{ kyiv_air_secrets['redis-password'] }}@{{ database_vm.private_ip }}:6379/0"
    history_rabbitmq_url: "amqp://kyiv_air:{{ kyiv_air_secrets['rabbitmq-password'] }}@{{ database_vm.private_ip }}:5672/kyiv-air"
    history_origins: >-
      {{ (((history_vm.env | default({})).ALLOWED_ORIGINS | default('')).split(',') | select | list
           + ['https://' ~ config_json.cloudflare.domain]) | unique | join(',') }}
  ansible.builtin.set_fact:
    history_env: >-
      {{ history_vm.env | default({}) | combine(
           {
             'PORT': '8081',
             'POSTGRES_ONLY': config_json.modes.postgres_only | string | lower,
             'DATABASE_URL': history_database_url,
             'FETCHER_SERVICE_URL': 'http://' ~ history_fetcher_ip ~ ':8080',
             'ALLOWED_ORIGINS': history_origins
           },
           {} if config_json.modes.postgres_only else {'REDIS_URL': history_redis_url, 'RABBITMQ_URL': history_rabbitmq_url}
         ) }}
  no_log: true

- name: Wait for the History database user
  ansible.builtin.include_role:
    name: kyiv_air.platform.probe
  vars:
    probe_type: psql
    probe_database_url: "{{ history_env.DATABASE_URL }}"
    probe_query: SELECT id FROM sessions LIMIT 0

- name: Wait for RabbitMQ
  ansible.builtin.include_role:
    name: kyiv_air.platform.probe
  vars:
    probe_type: tcp
    probe_host: "{{ database_vm.private_ip }}"
    probe_port: 5672
  when: not config_json.modes.postgres_only

- name: Wait for Redis
  ansible.builtin.include_role:
    name: kyiv_air.platform.probe
  vars:
    probe_type: oneshot
    probe_image: "{{ config_json.images.REDIS_IMAGE }}"
    probe_env:
      REDISCLI_AUTH: "{{ kyiv_air_secrets['redis-password'] }}"
    probe_command: [redis-cli, -h, "{{ database_vm.private_ip }}", PING]
    probe_expect: PONG
  when: not config_json.modes.postgres_only

- name: History service
  ansible.builtin.include_role:
    name: kyiv_air.platform.container
  vars:
    container_name: kyiv-air-history
    container_image: "{{ registry_url }}/history:{{ registry_tag }}"
    container_hardened: true
    container_ports:
      - "{{ history_vm.private_ip }}:8081:8081"
      - 127.0.0.1:8081:8081
    container_env: "{{ history_env }}"
    container_probe_url: http://127.0.0.1:8081/health

- name: History API probes
  ansible.builtin.include_role:
    name: kyiv_air.platform.probe
  vars:
    probe_type: http
    probe_url: "{{ item }}"
  loop:
    - http://127.0.0.1:8081/api/v1/locations
    - http://127.0.0.1:8081/api/v1/session
