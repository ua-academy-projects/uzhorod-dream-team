- name: Build the migration environment
  ansible.builtin.set_fact:
    migrate_env: >-
      {{ {
        'GOOSE_DBSTRING': 'postgres://kyiv_air_migrate:' ~ kyiv_air_secrets['postgres-migration-password'] ~ '@' ~ database_host ~ ':5432/' ~ cfg.database.name ~ '?sslmode=disable',
        'HISTORY_DB_PASSWORD': kyiv_air_secrets['postgres-history-password'],
        'POSTGRES_ONLY': cfg.modes.postgres_only | string | lower
      } | combine({'FETCHER_DB_PASSWORD': kyiv_air_secrets['postgres-fetcher-password']} if cfg.modes.postgres_only else {}) }}
  no_log: true

- name: Wait for PostgreSQL
  ansible.builtin.include_role:
    name: kyiv_air.platform.probe
  vars:
    probe_type: psql
    probe_database_url: "{{ migrate_env.GOOSE_DBSTRING }}"
    probe_query: SELECT 1

- name: Run database migrations
  community.docker.docker_container:
    name: kyiv-air-migrate
    image: "{{ migrate_image }}"
    pull: always
    networks:
      - name: kyiv-air
    env: "{{ migrate_env }}"
    command: [up]
    detach: false
    cleanup: true
    output_logs: true
  register: migrate_run
  changed_when: "'no migrations to run' not in (migrate_run.container.Output | default(''))"
  no_log: true
