- name: Read secrets from Secret Manager
  ansible.builtin.command:
    argv:
      - gcloud
      - secrets
      - versions
      - access
      - "{{ ((config_json.secrets | default({})).versions | default({})).get(item, 'latest') }}"
      - "--project={{ config_json.google.project_id }}"
      - "--secret={{ item }}"
  loop: "{{ secrets_names }}"
  register: secrets_read
  changed_when: false
  no_log: true

- name: Collect secrets
  ansible.builtin.set_fact:
    kyiv_air_secrets: "{{ dict(secrets_names | zip(secrets_read.results | map(attribute='stdout') | map('trim'))) }}"
  no_log: true

- name: Validate secrets
  ansible.builtin.assert:
    that:
      - kyiv_air_secrets[item] | length > 0
      - "'change_me' not in kyiv_air_secrets[item]"
      - "'your_' not in kyiv_air_secrets[item]"
      - (not (item.endswith('-password'))) or (kyiv_air_secrets[item] | length >= secrets_password_min_length and kyiv_air_secrets[item] is match('^[A-Za-z0-9_-]+$'))
    quiet: true
    fail_msg: "Secret {{ item }} is empty, a placeholder, or an invalid password."
  loop: "{{ secrets_names }}"
  no_log: true
