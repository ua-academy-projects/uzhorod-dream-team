connection_bastion_port: "{{ config_json.vm_options.ssh_port | default(222) }}"

ansible_port: "{{ connection_bastion_port if 'bastion' in group_names else 22 }}"
ansible_become: true
ansible_pipelining: true

connection_user: "{{ lookup('env', 'ANSIBLE_REMOTE_USER') }}"
connection_key: "{{ lookup('env', 'ANSIBLE_PRIVATE_KEY_FILE') }}"
connection_bastion: "{{ groups['bastion'][0] }}"
connection_jump: >-
  ssh -W %h:%p
  -p {{ connection_bastion_port }}
  -l {{ connection_user }}
  -i {{ connection_key }}
  -o IdentitiesOnly=yes
  -o StrictHostKeyChecking=accept-new
  {{ hostvars[connection_bastion].ansible_host }}

ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o IdentitiesOnly=yes
  {{ '' if 'bastion' in group_names else '-o ProxyCommand="' ~ connection_jump ~ '"' }}
