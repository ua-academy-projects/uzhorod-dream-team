sql_proxy_enabled: "{{ config_json.modes.cloud_sql }}"
sql_proxy_image: "{{ config_json.images.CLOUD_SQL_PROXY_IMAGE | default('gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2') }}"
sql_proxy_connection: "{{ config_json.google.project_id }}:{{ config_json.google.region }}:{{ (config_json.cloud_sql | default({})).name | default('kyiv-air-postgres') }}"
