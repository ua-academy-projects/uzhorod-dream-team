cfg: "{{ lookup('file', lookup('env', 'DEPLOYMENT_CONFIG')) | from_json }}"

ansible_port: "{{ cfg.vm_options.ssh_port | default(222) }}"
ansible_become: true
ansible_ssh_common_args: >-
  {{ '' if 'bastion' in group_names else
     '-o ProxyJump=' ~ (ansible_user | default(lookup('env', 'ANSIBLE_REMOTE_USER'))) ~ '@' ~ hostvars[groups['bastion'][0]].ansible_host ~ ':' ~ ansible_port }}

kyiv_air_network: kyiv-air
kyiv_air_config_dir: /etc/kyiv-air
kyiv_air_app_dir: /opt/kyiv-air
kyiv_air_registry_host: "{{ cfg.google.region }}-docker.pkg.dev"
kyiv_air_registry: "{{ kyiv_air_registry_host }}/{{ cfg.google.project_id }}/{{ cfg.registry.id | default('kyiv-air') }}"
kyiv_air_image_version: "{{ cfg.registry.image_version }}"
kyiv_air_cloud_sql: "{{ cfg.modes.cloud_sql }}"
kyiv_air_postgres_only: "{{ cfg.modes.postgres_only }}"
kyiv_air_database: "{{ cfg.database.name }}"
kyiv_air_db_host: "{{ 'kyiv-air-sql-proxy' if kyiv_air_cloud_sql else cfg.vm.db.private_ip }}"
kyiv_air_cloud_sql_connection: "{{ cfg.google.project_id }}:{{ cfg.google.region }}:{{ (cfg.cloud_sql | default({})).name | default('kyiv-air-postgres') }}"
kyiv_air_sql_proxy_image: "{{ cfg.images.CLOUD_SQL_PROXY_IMAGE | default('gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2') }}"
kyiv_air_probe_delay: 2
kyiv_air_probe_retries: "{{ ((cfg.vm_options.probe_timeout | default(600)) / kyiv_air_probe_delay) | int }}"
kyiv_air_ui_origin: "https://{{ cfg.cloudflare.domain }}"
kyiv_air_data_mount: "{{ cfg.vm.db.env.DATA_MOUNT | default('/srv/kyiv-air-data') }}"
