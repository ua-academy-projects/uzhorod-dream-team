- name: Validate the deployment config
  hosts: localhost
  gather_facts: false
  tags: [always]
  roles:
    - role: kyiv_air.platform.validate

- name: UI VM
  hosts: ui
  gather_facts: false
  roles:
    - role: kyiv_air.platform.connection
    - role: kyiv_air.platform.wait
    - role: kyiv_air.platform.base
    - role: kyiv_air.platform.ops_agent
    - role: kyiv_air.platform.secrets
      secrets_names: "{{ config_json.vm.instances.ui.secrets }}"
    - role: kyiv_air.platform.certbot
    - role: kyiv_air.platform.ui
