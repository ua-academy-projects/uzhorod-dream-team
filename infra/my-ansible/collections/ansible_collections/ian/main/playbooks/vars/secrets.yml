---
# Mapping of secrets from vault.yml to role variables. The vault itself is passed explicitly:
#   ansible-playbook ian.main.site -e @secrets/vault.yml
# Vault keys: vault_pgmq_password, vault_history_password, vault_cloudsql_history_password, vault_rabbit_user, vault_rabbit_password,
#              vault_redis_password, vault_cloudflare_api_token
# Values are evaluated only where the variable is actually used.
postgres_pgmq_password: "{{ vault_pgmq_password }}"
postgres_history_password: "{{ vault_history_password }}"

# queue_env secrets are not mapped here: the vault key names live in config.json backends.<N>.secrets.

querycache_rabbit_user: "{{ vault_rabbit_user }}"
querycache_rabbit_password: "{{ vault_rabbit_password }}"
querycache_redis_password: "{{ vault_redis_password }}"

# Application metrics for Ops Agent (querycache profile); the history profile's DB password is taken by the template itself from backends.<N>.secrets
ops_agent_config_rabbit_user: "{{ vault_rabbit_user }}"
ops_agent_config_rabbit_password: "{{ vault_rabbit_password }}"
ops_agent_config_redis_password: "{{ vault_redis_password }}"
ops_agent_config_database_host: "{{ queue_env_database_host | default('') }}"

frontend_cloudflare_api_token: "{{ vault_cloudflare_api_token }}"
