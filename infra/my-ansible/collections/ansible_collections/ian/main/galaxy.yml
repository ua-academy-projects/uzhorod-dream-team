---
# Collection identity: the FQCN of all content will be ian.main.<name>
namespace: ian
name: main
version: 1.0.0
readme: README.md

authors:
  - ian <yaanik@protonmail.com>

description: Roles, plugins and playbooks for deploying the OSM infrastructure (GCP)

license:
  - GPL-2.0-or-later

tags:
  - gcp
  - infrastructure

# ansible-galaxy will install these collections together with ian.main.
# Versions are not pinned strictly, only lower bounds, so updates don't break.
dependencies:
  community.general: ">=9.0.0"
  community.postgresql: ">=3.0.0"
  community.rabbitmq: ">=1.3.0"
  google.cloud: ">=1.4.0"

build_ignore: []
