[defaults]
inventory = inventory/gcp_osm.yml
# All the code lives in the ian.main collection (collections/ansible_collections/ian/main)
collections_path = collections
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
# SSH user (OS Login). Override with: ANSIBLE_REMOTE_USER=...
remote_user = yourremoteuser
# create it once: echo '<password>' > .vault_pass && chmod 600 .vault_pass (git-ignored)
vault_password_file = .vault_pass

[privilege_escalation]
become = True

[ssh_connection]
# pipelining is also what lets `become_user: postgres` work without world-readable temp files
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[inventory]
enable_plugins = ian.main.gcp_osm, yaml, ini
