---
container_specs:
  postgres:
    source: services/postgres
    port: 5432
    files:
      - { name: pg_hba.conf, mode: "0644" }
      - { name: weather-postgres.env, mode: "0600" }
    volumes:
      - weather-postgres:/var/lib/postgresql
      - /etc/weather-forecast/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - /run/weather-postgres:/var/run/postgresql
    command:
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=127.0.0.1,{{ ansible_host }}
  rabbitmq:
    port: 5672
    files:
      - { name: rabbitmq.conf, mode: "0644" }
      - { name: weather-rabbitmq.env, mode: "0600" }
    volumes:
      - weather-rabbitmq:/var/lib/rabbitmq
      - /etc/weather-forecast/rabbitmq.conf:/etc/rabbitmq/conf.d/20-weather.conf:ro
  redis:
    port: 6379
    files:
      - { name: redis.conf, mode: "0600", owner: "999" }
    volumes:
      - weather-redis:/data
      - /etc/weather-forecast/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
  fetcher:
    source: services/fetcher
    health: http://127.0.0.1:8001/health
    files:
      - { name: weather-fetcher.env, mode: "0600" }
  history:
    source: services/history
    health: http://{{ ansible_host }}:8002/health
    files:
      - { name: weather-history.env, mode: "0600" }
  ui:
    source: services/ui
    port: 443
    files:
      - { name: nginx.conf, mode: "0644" }
    volumes:
      - /etc/weather-forecast/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - weather-letsencrypt:/etc/letsencrypt:ro
      - /var/log/weather-nginx:/var/log/nginx
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    files:
      - { name: weather-cloudflared.env, mode: "0600" }
    command:
      - tunnel
      - --no-autoupdate
      - run
