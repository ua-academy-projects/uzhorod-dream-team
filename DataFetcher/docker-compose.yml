services:
  postgres:
    image: ghcr.io/pgmq/pg16-pgmq:v1.10.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-history}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-k"  # synchronous commit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-datamonitor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-datamonitor}
    ports:
      - "5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    profiles:
      - "hybrid"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - "hybrid"

  fetcher:
    build: ./fetcher
    profiles:
      - "${APP_BACKEND:-hybrid}"
    environment:
      APP_BACKEND: ${APP_BACKEND:-hybrid}
      SOURCES: ${SOURCES:-btc=https://api.coinbase.com/v2/prices/BTC-USD/spot,eth=https://api.coinbase.com/v2/prices/ETH-USD/spot}
      FETCHER_PORT: 8000
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://datamonitor:datamonitor@rabbitmq:5672/}
      FETCHER_POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      FETCHER_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      FETCHER_POSTGRES_DB: ${POSTGRES_DB:-history}
      FETCHER_POSTGRES_USER: ${FETCHER_POSTGRES_USER:-fetcher_worker}
      FETCHER_POSTGRES_PASSWORD: ${FETCHER_POSTGRES_PASSWORD:-fetcher}
    ports:
      - "8001:8000"
    restart: unless-stopped

  history:
    build: ./history
    profiles:
      - "${APP_BACKEND:-hybrid}"
    environment:
      APP_BACKEND: ${APP_BACKEND:-hybrid}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://datamonitor:datamonitor@rabbitmq:5672/}
      HISTORY_INTERVAL_SECONDS: ${HISTORY_INTERVAL_SECONDS:-10}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-history}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FETCHER_POSTGRES_PASSWORD: ${FETCHER_POSTGRES_PASSWORD:-fetcher}
      PORT: 8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fetcher:
        condition: service_started
    restart: unless-stopped

  ui:
    build: ./ui
    profiles:
      - "${APP_BACKEND:-hybrid}"
    environment:
      APP_BACKEND: ${APP_BACKEND:-hybrid}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HISTORY_SERVICE_URL: ${HISTORY_SERVICE_URL:-http://history:8000}
    ports:
      - "8000:8000"
    depends_on:
      history:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
